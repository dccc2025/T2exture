table06_real_benchmark:
  config: configs/formal/table06/real-benchmark.yaml
  section: 5.2.2
  note: Evaluate synthetic-trained or official-pretrained methods on six real sequences. Save per-sequence artifacts, then report the unweighted mean across sequence-level metrics.
  data_root: datasets/real
  active_anchor_ids:
    - 1
    - 11
    - 21
    - 31
    - 41
    - 51
    - 61
    - 71
    - 81
    - 91
    - 101
    - 111
    - 121
    - 131
    - 141
    - 151
    - 161
    - 171
    - 180
  passive_frame_rule: all frame IDs not listed in active_anchor_ids
  passive_context_rule: nearest non-anchor passive frames excluding the target frame
  time_normalization: use (target_id - left_id) / (right_id - left_id), including the final 171-to-180 interval.
  exclude_dirs:
    - cailbr
  sequences:
    - bag
    - doll_01
    - doll_02
    - doll_03
    - doll_04
    - doll_05
  metrics:
    - En
    - AG
    - SF
    - SD
    - SCD
    - PI
  metric_notes:
    En: 8-bit Shannon entropy on predicted grayscale frames.
    AG: average gradient on predicted grayscale frames, reported in 8-bit gray-level units by multiplying normalized outputs by 255.
    SF: spatial frequency on predicted grayscale frames, reported in 8-bit gray-level units by multiplying normalized outputs by 255.
    SD: standard deviation on predicted grayscale frames, reported in 8-bit gray-level units by multiplying normalized outputs by 255.
    SCD: sum of correlations of differences using left and right active endpoints as source frames.
    PI: perceptual index from pyiqa's built-in PI metric, equivalent to (NIQE + (10 - NRQM)) / 2 with its internal NIQE/NRQM settings; lower is better.
  aggregation:
    frame_to_sequence: arithmetic_mean
    sequence_to_table: unweighted_arithmetic_mean
  rows:
    - exp_id: table06_real_benchmark/ifrnet
      label: IFRNet [CVPR 2022]
      params: 5.00M
    - exp_id: table06_real_benchmark/sgm-vfi
      label: SGM-VFI [CVPR 2024]
      params: 20.80M
    - exp_id: table06_real_benchmark/bim-vfi
      label: BiM-VFI [CVPR 2025]
      params: 6.88M
    - exp_id: table06_real_benchmark/gimm-vfi-f
      label: GIMM-VFI-F [NeurIPS 2024]
      params: 30.61M
    - exp_id: table06_real_benchmark/amt-l-vanilla
      label: AMT-L [CVPR 2023]
      params: 12.94M
    - exp_id: table06_real_benchmark/ours-l
      label: Ours-L
      params: 13.14M
  output_contract:
    method_root:
      - metrics.json
      - sequence.csv
      - manifest.json
    sequence_root:
      - pred/
      - frame.csv
      - metrics.json
      - manifest.json
      - vis/png/
      - vis/video/
  no_gt_metrics_only: true

table07_component_ablation:
  section: Ours-L component ablation
  note: Only the two middle Ours-L rows are scheduled by run_experiments.py --table07. AMT-L and Full T2exture are reference rows reused from completed formal outputs.
  default_backbone: amt-l
  data_root: datasets
  config: configs/formal/table07/passive-guidance-no-temporal.yaml
  row_sources:
    - exp_id: table07_component_ablation/amt-l
      label: AMT-L
      source_metrics: outputs/final/table01_prior/amt-l-vanilla/test/metrics.json
      scheduled: false
    - exp_id: table07_component_ablation/t2v-adapter
      label: + T2V
      source_metrics: outputs/final/table03_passive_context/context-per-side-00/test/metrics.json
      scheduled: true
      reused_by_runner: true
    - exp_id: table07_component_ablation/passive-guidance-no-temporal
      label: + Passive Guidance w/o temporal modulation
      source_metrics: outputs/final/table07_component_ablation/passive-guidance-no-temporal/test/metrics.json
      scheduled: true
    - exp_id: table07_component_ablation/full-t2texture
      label: Full T2exture
      source_metrics: outputs/final/table03_passive_context/context-per-side-02/test/metrics.json
      scheduled: false
  components:
    t2v_adapter: The one-channel-to-AMT texture adapter and target-time texture conditioning.
    passive_guidance: Passive-context feature pyramid injected into AMT-L decoder stages.
    rel_pe: Passive temporal modulation through target-time biases in the passive feature pyramid.
  rows:
    - variant: AMT-L
      t2v_adapter: false
      passive_guidance: false
      rel_pe: false
    - variant: + T2V
      t2v_adapter: true
      passive_guidance: false
      rel_pe: false
    - variant: + Passive Guidance w/o temporal modulation
      t2v_adapter: true
      passive_guidance: true
      rel_pe: false
    - variant: Full T2exture
      t2v_adapter: true
      passive_guidance: true
      rel_pe: true

