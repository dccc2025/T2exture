# Machine-readable experiment manifest for reproducibility checks.

workspace: D:/HADAR/T2exture
environment: t2exture
formal_data_root: datasets
source_data_root: dataset
real_data_root: datasets/real
outputs_root: outputs/final
default_config: train.yaml

global_rules:
  - use_datasets_for_formal_runs
  - do_not_write_generated_flow_under_sim_scene
  - do_not_overwrite_dataset_flow_s10
  - keep_full_eval_artifacts
  - run_one_heavy_gpu_training_job_at_a_time
  - stop_on_metric_or_visual_abnormality
  - table06_uses_synthetic_trained_models_without_real_finetune

default_protocol:
  active_stride: 10
  passive_context: 4
  sample_passive_context: null
  pseudo_flow_dir: flow/s10
  crop_size: 384
  adapter_iterations: 10000
  finetune_iterations: 5000
  batch_size: 4
  valid_batch_size: 1
  eval_batch_size: 1
  num_workers: 16
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  valid_interval: 500
  loss:
    charbonnier: 1.0
    css: 0.1
    flow: 0.001

visualization_protocol:
  image_cmap: gray
  error_cmap: gray
  error_percentile: 99.0
  note: Formal visualization uses grayscale for input, prediction, GT, and absolute-error panels.

synthetic_metric_notes:
  Edge-FI@2px: Canny edge maps are extracted from 8-bit grayscale prediction and target frames with thresholds 100/200, aperture size 3, L2 gradient magnitude, and 2-pixel boundary matching tolerance.

preflight:
  required_paths:
    - datasets/train.txt
    - datasets/valid.txt
    - datasets/test.txt
    - datasets/dataset_manifest.json
    - datasets/preview
    - datasets/sim
    - datasets/flow/s10
    - pretrained/amt-s.pth
    - pretrained/amt-l.pth
    - pretrained/amt-g.pth
    - pretrained/LiteFlowNet.pth
    - pretrained/GIMM-VFI-F/flowformer_sintel.pth
    - pretrained/GIMM-VFI-F/gimm.pt
    - pretrained/GIMM-VFI-F/gimmvfi_f_arb.pt
    - third_party/AMT_official
    - third_party/IFRNet
    - third_party/SGM-VFI
    - third_party/BiM-VFI
    - third_party/GIMM-VFI
    - datasets/real/bag
    - datasets/real/doll_01
    - datasets/real/doll_02
    - datasets/real/doll_03
    - datasets/real/doll_04
    - datasets/real/doll_05
    - configs/formal/table06/real-benchmark.yaml
  currently_missing_expected: []
  expected_split_counts:
    train: 20
    valid: 4
    test: 8
  expected_sample_counts:
    train: 3040
    valid: 608
    test: 1216
  expected_frame_shape_hw:
    - 640
    - 960
  expected_scene_count: 32
  expected_s10_flow_files: 4892
  expected_preview_count: 32
  expected_max_object_bbox_hw:
    - 599
    - 753
  expected_frames_per_scene: 180
  preflight_command: conda run -n t2exture python -B scripts/formal/preflight.py --manifest configs/formal/experiment_manifest.yaml --config train.yaml
  smoke_command: python -B -m unittest tests.test_smoke -v

commands:
  create_datasets: conda run -n t2exture python -B data_preparation/prepare_datasets.py --source-root dataset --output-root datasets --height 640 --width 960 --flow-set s10
  sync_metrics: conda run -n t2exture python -B scripts/formal/collect_metrics.py --outputs-root outputs/final --csv outputs/final/_summary/metrics_summary.csv --markdown outputs/final/_summary/metrics_summary.md --per-table-dir outputs/final/_summary/by_table
  eval_ifrnet: conda run -n t2exture python -B scripts/baselines/evaluate_ifrnet.py --data-root datasets --checkpoint pretrained/IFRNet/IFRNet_Vimeo90K.pth --split test --output-dir outputs/final/table01_prior/ifrnet/test --config train.yaml
  vis_ifrnet: conda run -n t2exture python -B vis.py --eval-dir outputs/final/table01_prior/ifrnet/test --output-dir outputs/final/table01_prior/ifrnet/test/vis --method-label IFRNet --max-frames-per-scene 5
  eval_sgm_vfi: conda run -n t2exture python -B scripts/baselines/evaluate_sgm_vfi.py --data-root datasets --pretrained-root pretrained/sgm-vfi --exp-name ours-1-2-points --split test --output-dir outputs/final/table01_prior/sgm-vfi/test --config train.yaml
  vis_sgm_vfi: conda run -n t2exture python -B vis.py --eval-dir outputs/final/table01_prior/sgm-vfi/test --output-dir outputs/final/table01_prior/sgm-vfi/test/vis --method-label SGM-VFI --max-frames-per-scene 5
