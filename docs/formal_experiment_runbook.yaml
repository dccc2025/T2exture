# ASCII runbook for Windows/Codex execution.
# The Chinese manuscript-facing plan remains in synthetic_only_experiment_plan_2026-07-23.md.

workspace: D:/HADAR/T2exture
environment: gflow
formal_data_root: dataset_roi
source_data_root: dataset
outputs_root: outputs/final
default_config: train.yaml

global_rules:
  - use_dataset_roi_for_formal_runs
  - do_not_write_generated_flow_under_sim_scene
  - do_not_overwrite_dataset_flow_s10
  - keep_full_eval_artifacts
  - run_one_heavy_gpu_training_job_at_a_time
  - stop_on_metric_or_visual_abnormality

default_protocol:
  active_stride: 10
  passive_context: 4
  sample_passive_context: null
  pseudo_flow_dir: flow/s10
  crop_size: 384
  adapter_iterations: 10000
  finetune_iterations: 5000
  batch_size: 4
  valid_batch_size: 1
  eval_batch_size: 1
  num_workers: 16
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  valid_interval: 500
  loss:
    charbonnier: 1.0
    css: 0.1
    flow: 0.001

visualization_protocol:
  image_cmap: gray
  error_cmap: gray
  error_percentile: 99.0
  note: Formal visualization uses grayscale for input, prediction, GT, and absolute-error panels.

preflight:
  required_paths:
    - dataset_roi/train.txt
    - dataset_roi/valid.txt
    - dataset_roi/test.txt
    - dataset_roi/roi_manifest.json
    - dataset_roi/roi_preview
    - dataset_roi/sim
    - dataset_roi/flow/s10
    - pretrained/amt-s.pth
    - pretrained/amt-l.pth
    - pretrained/amt-g.pth
    - pretrained/LiteFlowNet.pth
    - pretrained/GIMM-VFI-F/flowformer_sintel.pth
    - pretrained/GIMM-VFI-F/gimm.pt
    - pretrained/GIMM-VFI-F/gimmvfi_f_arb.pt
    - third_party/AMT_official
    - third_party/IFRNet
    - third_party/SGM-VFI
    - third_party/BiM-VFI
    - third_party/GIMM-VFI
  currently_missing_expected: []
  expected_split_counts:
    train: 20
    valid: 4
    test: 8
  expected_sample_counts:
    train: 3040
    valid: 608
    test: 1216
  expected_roi_shape_hw:
    - 640
    - 960
  expected_roi_scene_count: 32
  expected_s10_flow_files: 4892
  expected_roi_preview_count: 32
  expected_max_texture_bbox_hw:
    - 599
    - 753
  expected_frames_per_scene: 180
  preflight_command: conda run -n gflow python -B scripts/preflight_formal.py --runbook docs/formal_experiment_runbook.yaml --config train.yaml
  smoke_command: python -B -m pytest tests/test_smoke.py -q -p no:cacheprovider

commands:
  create_dataset_roi: conda run -n gflow python -B data_preparation/create_dataset_roi.py --source-root dataset --output-root dataset_roi --height 640 --width 960 --flow-set s10
  sync_metrics: conda run -n gflow python -B scripts/sync_formal_metrics.py --outputs-root outputs/final --csv outputs/final/_summary/metrics_summary.csv --markdown outputs/final/_summary/metrics_summary.md --per-table-dir outputs/final/_summary/by_table
  eval_ifrnet: conda run -n gflow python -B scripts/eval_ifrnet.py --data-root dataset_roi --checkpoint pretrained/IFRNet/IFRNet_Vimeo90K.pth --split test --output-dir outputs/final/table01_prior/ifrnet/test --config train.yaml
  vis_ifrnet: conda run -n gflow python -B vis.py --eval-dir outputs/final/table01_prior/ifrnet/test --output-dir outputs/final/table01_prior/ifrnet/test/vis --method-label IFRNet --max-frames-per-scene 5
  eval_sgm_vfi: conda run -n gaussian_flow python -B scripts/eval_sgm_vfi.py --data-root dataset_roi --pretrained-root pretrained/sgm-vfi --exp-name ours-1-2-points --split test --output-dir outputs/final/table01_prior/sgm-vfi/test --config train.yaml
  vis_sgm_vfi: conda run -n gflow python -B vis.py --eval-dir outputs/final/table01_prior/sgm-vfi/test --output-dir outputs/final/table01_prior/sgm-vfi/test/vis --method-label SGM-VFI --max-frames-per-scene 5
  eval_bim_vfi: conda run -n gflow python -B scripts/eval_bim_vfi.py --data-root dataset_roi --checkpoint pretrained/bim-vfi/bim_vfi.pth --split test --output-dir outputs/final/table01_prior/bim-vfi/test --config train.yaml
  vis_bim_vfi: conda run -n gflow python -B vis.py --eval-dir outputs/final/table01_prior/bim-vfi/test --output-dir outputs/final/table01_prior/bim-vfi/test/vis --method-label BiM-VFI --max-frames-per-scene 5
  eval_gimm_vfi_f: conda run -n gaussian_flow python -B scripts/eval_gimm_vfi_f.py --data-root dataset_roi --checkpoint pretrained/GIMM-VFI-F/gimmvfi_f_arb.pt --flowformer pretrained/GIMM-VFI-F/flowformer_sintel.pth --split test --output-dir outputs/final/table01_prior/gimm-vfi-f/test --config train.yaml
