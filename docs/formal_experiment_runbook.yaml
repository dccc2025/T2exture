# ASCII runbook for Windows/Codex execution.
# The Chinese manuscript-facing plan remains in synthetic_only_experiment_plan_2026-07-23.md.

workspace: D:/HADAR/T2exture
environment: gflow
formal_data_root: dataset_roi
source_data_root: dataset
outputs_root: outputs/final
default_config: train.yaml

global_rules:
  - use_dataset_roi_for_formal_runs
  - do_not_write_generated_flow_under_sim_scene
  - do_not_overwrite_dataset_flow_s10
  - keep_full_eval_artifacts
  - run_one_heavy_gpu_training_job_at_a_time
  - stop_on_metric_or_visual_abnormality

default_protocol:
  active_stride: 10
  passive_context: 4
  sample_passive_context: null
  pseudo_flow_dir: flow/s10
  crop_size: 384
  adapter_iterations: 10000
  finetune_iterations: 5000
  batch_size: 4
  valid_batch_size: 1
  eval_batch_size: 1
  num_workers: 16
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  valid_interval: 500
  loss:
    charbonnier: 1.0
    css: 0.1
    flow: 0.001

preflight:
  required_paths:
    - dataset_roi/train.txt
    - dataset_roi/valid.txt
    - dataset_roi/test.txt
    - dataset_roi/roi_manifest.json
    - dataset_roi/roi_preview
    - dataset_roi/sim
    - dataset_roi/flow/s10
    - pretrained/amt-s.pth
    - pretrained/amt-l.pth
    - pretrained/amt-g.pth
    - pretrained/IFRNet.pth
    - pretrained/flowformer_sintel.pth
    - pretrained/gimm.pt
    - pretrained/gimmvfi_f_arb.pt
    - third_party/AMT_official
    - third_party/IFRNet
    - third_party/SGM-VFI
    - third_party/BiM-VFI
    - third_party/GIMM-VFI
  currently_missing_expected: []
  expected_split_counts:
    train: 20
    valid: 4
    test: 8
  expected_sample_counts:
    train: 3040
    valid: 608
    test: 1216
  expected_roi_shape_hw:
    - 640
    - 960
  expected_roi_scene_count: 32
  expected_s10_flow_files: 4892
  expected_roi_preview_count: 32
  expected_max_texture_bbox_hw:
    - 599
    - 753
  expected_frames_per_scene: 180
  preflight_command: conda run -n gflow python -B scripts/preflight_formal.py --runbook docs/formal_experiment_runbook.yaml --config train.yaml
  smoke_command: python -B -m pytest tests/test_smoke.py -q -p no:cacheprovider

commands:
  create_dataset_roi: conda run -n gflow python -B data_preparation/create_dataset_roi.py --source-root dataset --output-root dataset_roi --height 640 --width 960 --flow-set s10
  sync_metrics: conda run -n gflow python -B scripts/sync_formal_metrics.py --outputs-root outputs/final --csv outputs/final/_summary/metrics_summary.csv --markdown outputs/final/_summary/metrics_summary.md --per-table-dir outputs/final/_summary/by_table
  eval_amt_s_vanilla: conda run -n gflow python -B scripts/eval_amt_vanilla.py --data-root dataset_roi --pretrained pretrained/amt-s.pth --backbone amt-s --split test --output-dir outputs/final/table02_amt_size/amt-s-vanilla/test --config train.yaml
  eval_amt_l_vanilla_table01: conda run -n gflow python -B scripts/eval_amt_vanilla.py --data-root dataset_roi --pretrained pretrained/amt-l.pth --backbone amt-l --split test --output-dir outputs/final/table01_prior/amt-l-vanilla/test --config train.yaml
  eval_amt_l_vanilla_table02: conda run -n gflow python -B scripts/eval_amt_vanilla.py --data-root dataset_roi --pretrained pretrained/amt-l.pth --backbone amt-l --split test --output-dir outputs/final/table02_amt_size/amt-l-vanilla/test --config train.yaml
  eval_amt_g_vanilla: conda run -n gflow python -B scripts/eval_amt_vanilla.py --data-root dataset_roi --pretrained pretrained/amt-g.pth --backbone amt-g --split test --output-dir outputs/final/table02_amt_size/amt-g-vanilla/test --config train.yaml
  vis_amt_s_vanilla: conda run -n gflow python -B vis.py --eval-dir outputs/final/table02_amt_size/amt-s-vanilla/test --output-dir outputs/final/table02_amt_size/amt-s-vanilla/test/vis --method-label AMT-S --max-frames-per-scene 5
  vis_amt_l_vanilla_table01: conda run -n gflow python -B vis.py --eval-dir outputs/final/table01_prior/amt-l-vanilla/test --output-dir outputs/final/table01_prior/amt-l-vanilla/test/vis --method-label AMT-L --max-frames-per-scene 5
  vis_amt_l_vanilla_table02: conda run -n gflow python -B vis.py --eval-dir outputs/final/table02_amt_size/amt-l-vanilla/test --output-dir outputs/final/table02_amt_size/amt-l-vanilla/test/vis --method-label AMT-L --max-frames-per-scene 5
  vis_amt_g_vanilla: conda run -n gflow python -B vis.py --eval-dir outputs/final/table02_amt_size/amt-g-vanilla/test --output-dir outputs/final/table02_amt_size/amt-g-vanilla/test/vis --method-label AMT-G --max-frames-per-scene 5
  train_ours_l: conda run -n gflow python -B train.py --data-root dataset_roi --pretrained pretrained/amt-l.pth --backbone amt-l --output-dir outputs/final/table01_prior/ours-l --config train.yaml
  eval_ours_l: conda run -n gflow python -B eval.py --data-root dataset_roi --pretrained pretrained/amt-l.pth --backbone amt-l --checkpoint outputs/final/table01_prior/ours-l/best.pt --split test --output-dir outputs/final/table01_prior/ours-l/test --config train.yaml
  vis_ours_l: conda run -n gflow python -B vis.py --eval-dir outputs/final/table01_prior/ours-l/test --method-label Ours-L
  generate_flow_stride_template: conda run -n gflow python -B -m flow_generation.generate_liteflownet_flow --data-root dataset_roi --active-stride STRIDE --splits train valid test --device cuda

formal_output_paths:
  table01_prior:
    ifrnet: outputs/final/table01_prior/ifrnet
    sgm-vfi: outputs/final/table01_prior/sgm-vfi
    bim-vfi: outputs/final/table01_prior/bim-vfi
    gimm-vfi-f: outputs/final/table01_prior/gimm-vfi-f
    amt-l-vanilla: outputs/final/table01_prior/amt-l-vanilla
    ours-l: outputs/final/table01_prior/ours-l
  table02_amt_size:
    amt-s-vanilla: outputs/final/table02_amt_size/amt-s-vanilla
    amt-s-t2texture: outputs/final/table02_amt_size/amt-s-t2texture
    amt-l-vanilla: outputs/final/table02_amt_size/amt-l-vanilla
    amt-l-t2texture: outputs/final/table02_amt_size/amt-l-t2texture
    amt-g-vanilla: outputs/final/table02_amt_size/amt-g-vanilla
    amt-g-t2texture: outputs/final/table02_amt_size/amt-g-t2texture
  table03_passive_context:
    passive-refs-00: outputs/final/table03_passive_context/passive-refs-00
    passive-refs-02: outputs/final/table03_passive_context/passive-refs-02
    passive-refs-04: outputs/final/table03_passive_context/passive-refs-04
    passive-refs-06: outputs/final/table03_passive_context/passive-refs-06
    passive-refs-08: outputs/final/table03_passive_context/passive-refs-08
    passive-refs-10: outputs/final/table03_passive_context/passive-refs-10
  table04_active_sparsity:
    active-stride-02: outputs/final/table04_active_sparsity/active-stride-02
    active-stride-03: outputs/final/table04_active_sparsity/active-stride-03
    active-stride-04: outputs/final/table04_active_sparsity/active-stride-04
    active-stride-05: outputs/final/table04_active_sparsity/active-stride-05
    active-stride-06: outputs/final/table04_active_sparsity/active-stride-06
    active-stride-07: outputs/final/table04_active_sparsity/active-stride-07
    active-stride-08: outputs/final/table04_active_sparsity/active-stride-08
    active-stride-09: outputs/final/table04_active_sparsity/active-stride-09
    active-stride-10: outputs/final/table04_active_sparsity/active-stride-10
    active-stride-11: outputs/final/table04_active_sparsity/active-stride-11
  table05_deployment:
    amt-s-vanilla: outputs/final/table05_deployment/amt-s-vanilla
    amt-s-t2texture: outputs/final/table05_deployment/amt-s-t2texture
    amt-l-vanilla: outputs/final/table05_deployment/amt-l-vanilla
    amt-l-t2texture: outputs/final/table05_deployment/amt-l-t2texture
    amt-g-vanilla: outputs/final/table05_deployment/amt-g-vanilla
    amt-g-t2texture: outputs/final/table05_deployment/amt-g-t2texture
  summary:
    metrics_csv: outputs/final/_summary/metrics_summary.csv
    metrics_markdown: outputs/final/_summary/metrics_summary.md
    by_table_dir: outputs/final/_summary/by_table

table03_passive_context:
  note: Set sample_passive_context to 10 for every row so all rows use the same target-frame window.
  rows:
    - exp_id: table03_passive_context/passive-refs-00
      passive_context: 0
      sample_passive_context: 10
    - exp_id: table03_passive_context/passive-refs-02
      passive_context: 2
      sample_passive_context: 10
    - exp_id: table03_passive_context/passive-refs-04
      passive_context: 4
      sample_passive_context: 10
    - exp_id: table03_passive_context/passive-refs-06
      passive_context: 6
      sample_passive_context: 10
    - exp_id: table03_passive_context/passive-refs-08
      passive_context: 8
      sample_passive_context: 10
    - exp_id: table03_passive_context/passive-refs-10
      passive_context: 10
      sample_passive_context: 10

table04_active_sparsity:
  note: Keep passive_context fixed at 4 and change only active_stride plus pseudo_flow_dir.
  rows:
    - active_stride: 2
      pseudo_flow_dir: flow/s02
    - active_stride: 3
      pseudo_flow_dir: flow/s03
    - active_stride: 4
      pseudo_flow_dir: flow/s04
    - active_stride: 5
      pseudo_flow_dir: flow/s05
    - active_stride: 6
      pseudo_flow_dir: flow/s06
    - active_stride: 7
      pseudo_flow_dir: flow/s07
    - active_stride: 8
      pseudo_flow_dir: flow/s08
    - active_stride: 9
      pseudo_flow_dir: flow/s09
    - active_stride: 10
      pseudo_flow_dir: flow/s10
    - active_stride: 11
      pseudo_flow_dir: flow/s11

artifact_contract:
  train_outputs:
    - best.pt
    - last.pt
    - config.json
  eval_outputs:
    - pred/
    - err/
    - metrics.json
    - scene.csv
    - frame.csv
    - manifest.json
  vis_outputs:
    - vis/png/
    - vis/video/
